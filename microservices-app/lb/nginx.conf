events {}

http {
  upstream api_gateway {
    server api-gateway:80;
  }

  server {
    listen 80;

    # Serve UI
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri /index.html;
    }

    # Forward API calls
    location /api/ {
      proxy_pass http://api_gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
