services:
  lb:
    image: nginx:alpine
    container_name: load-balancer
    volumes:
      - ./lb/nginx.conf:/etc/nginx/nginx.conf
      - ./lb/html:/usr/share/nginx/html
    ports:
      - "80:80"
    depends_on:
      - api-gateway

  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      DB_HOST: ${USER_DB_HOST}
      DB_USER: ${USER_DB_USER}
      DB_PASSWORD: ${USER_DB_PASSWORD}
      DB_NAME: ${USER_DB_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      retries: 5
    depends_on:
      user-db:
        condition: service_healthy

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      DB_HOST: ${ORDER_DB_HOST}
      DB_USER: ${ORDER_DB_USER}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      DB_NAME: ${ORDER_DB_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      retries: 5
    depends_on:
      order-db:
        condition: service_healthy

  user-db:
    image: mysql:8.0
    container_name: user-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${USER_DB_NAME}
    volumes:
      - ./user-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 5

  order-db:
    image: mysql:8.0
    container_name: order-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${ORDER_DB_NAME}
    volumes:
      - ./order-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 5
