services:
# Nginx and static html render
    frontend:
       images: nginx:1.28.1-alpine3.23
       container_name: frontend
       volume:
          - ./frontend/index.html:/usr/share/nginx/html/index.html
          - ./frontend/nginx.conf:/etc/nginx/nginx.conf
       ports:
           - 80:80
       depends_on:
       backend:
        condition: service_started
       networks:
           - app-net
#Node API 
    backend:
       build: ./backend
       container_name: backend
       environment:
        DB_HOST: ${DB_HOST}
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_NAME: ${DB_NAME} 
        healthcheck:
         test: ["CMD", "curl", "-v", "http://localhost:3000/health"]
         interval: 10s
         retries: 5
       depends_on:
         - db 
       condition: service_healthy
       networks:
           - app-net
    db:
     images: mysql:8.0
     container_name: mysql
     environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
     volume:
          - mysql-data:/var/lib/mysql
          - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
         test: ["CMDSHELL", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
         interval: 10s
         retries: 5
    networks:
           - app-net

networks:
app-net:
  - driver: bridge
volume:
  - mysql-data